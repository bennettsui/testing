<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Social Research API UI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 900px;
        margin: 40px auto;
        padding: 20px;
        line-height: 1.6;
      }
      h1 {
        color: #333;
        border-bottom: 3px solid #4CAF50;
        padding-bottom: 10px;
      }
      section {
        background: #f9f9f9;
        padding: 20px;
        margin: 20px 0;
        border-radius: 8px;
        border: 1px solid #ddd;
      }
      h2 {
        color: #555;
        margin-top: 0;
      }
      label {
        display: block;
        margin: 10px 0;
        font-weight: 500;
      }
      input, textarea {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
        box-sizing: border-box;
      }
      button {
        background: #4CAF50;
        color: white;
        padding: 12px 30px;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
        margin: 20px 0;
      }
      button:hover {
        background: #45a049;
      }
      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      #result {
        background: #f4f4f4;
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 15px;
        overflow-x: auto;
        max-height: 600px;
        font-size: 13px;
      }
      .loading {
        color: #666;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <h1>🔬 Social Research API – Demo UI</h1>

    <section>
      <h2>Brand Config</h2>
      <label>
        Brand Name:
        <input id="brand_name" value="CafeHK" />
      </label>
      <label>
        Markets (comma separated):
        <input id="markets" value="HK" />
      </label>
      <label>
        Languages (comma separated):
        <input id="languages" value="zh-HK,en" />
      </label>
      <label>
        Platforms (comma separated):
        <input id="platforms" value="IG,Threads" />
      </label>
      <label>
        Cutoff Time:
        <input id="cutoff_time" value="08:00" />
      </label>
      <label>
        Tone Keywords (comma separated):
        <input id="tone_keywords" value="playful,smart" />
      </label>
      <label>
        Risk Level:
        <input id="risk_level" value="moderate" />
      </label>
    </section>

    <section>
      <h2>Campaign Brief</h2>
      <label>
        Title:
        <input id="title" value="CafeHK Launch Campaign" />
      </label>
      <label>
        Objectives (comma separated):
        <input id="objectives" value="Awareness,Engagement" />
      </label>
      <label>
        Primary Audience:
        <input id="primary_audience" value="25-35 HK office workers tired of boring chains" />
      </label>
      <label>
        Product Description:
        <textarea id="product_description" rows="3">Specialty coffee with playful vibe</textarea>
      </label>
      <label>
        Key Messages (comma separated):
        <input id="key_messages" value="serious coffee, not serious life" />
      </label>
      <label>
        References (comma separated URLs):
        <input id="references" value="https://instagram.com/bluebottle" />
      </label>
    </section>

    <button id="run">▶ Run Research</button>

    <h2>Result</h2>
    <pre id="result">Click "Run Research" to start...</pre>

    <script src="main.js" type="module"></script>
  </body>
</html>
